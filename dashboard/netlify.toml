[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  # Name the functions folder explicitly. When this folder sits inside a bigger repo, the CLI resolves
  # relative paths from the repo root, finds no functions, and /api/quotes returns 404 locally.
  functions = "netlify/functions"

# Baseline hardening. A Content-Security-Policy is worth adding once you've checked it in your browser:
#   default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;
#   connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
