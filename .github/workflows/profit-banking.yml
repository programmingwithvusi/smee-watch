name: profit-banking

# Hourly during market hours, weekdays: a profit-banking rung is about where the price has settled,
# not a fast-moving signal, so there's no benefit to the 15-min cadence markets.yml uses.
on:
  schedule:
    - cron: "15 1-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: state-profit-banking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check profit-banking rungs
        run: npm run bank:check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Cost basis is private: it lives in this secret, not in the public repo
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "smee-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): profit-banking"
            git pull --rebase --autostash
            git push
          fi
