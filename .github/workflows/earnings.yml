name: earnings

# Once a day is enough: the reminder offsets in src/config.ts (7, 3, 1, 0 days before) are whole
# calendar days, so there's no benefit to checking more often.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: state-earnings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check earnings calendar
        run: npm run earnings:check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "smee-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): earnings"
            git pull --rebase --autostash
            git push
          fi
