name: macro

# Hourly: collects broad market headlines (AI spending, oil/geopolitics, rates, China policy) and
# tags them by theme into state/headlines.json. Silent -- it sends no alerts itself. The markets
# workflow reads that file so a price alert can say what the news was about.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: state-macro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect macro headlines
        run: npm run watch:macro
        env:
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "smee-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): macro headlines"
            git pull --rebase --autostash
            git push
          fi
