name: markets

# Weekdays, 01:00-20:30 UTC covers STAR/HKEX (01:30-08:00), Amsterdam (07:00-15:30) and Nasdaq (13:30-20:00).
# Every 15 minutes rather than 30: faster detection of both the fixed-threshold and volatility-widening
# alerts is most of what "anticipate a slide" can honestly mean for a public price feed — the rest is
# catalyst news (catalysts.yml) and the earnings calendar (earnings.yml), which run separately.
# The 15:45 UTC run sends the daily digest, which doubles as a heartbeat: if it stops arriving, something broke.
on:
  schedule:
    - cron: "*/15 1-20 * * 1-5"
    - cron: "45 15 * * 1-5"
  workflow_dispatch:
    inputs:
      digest:
        description: "Send the digest instead of checking for moves"
        type: boolean
        default: false

concurrency:
  group: state-markets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  markets:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check markets
        run: npm run ${{ (github.event.schedule == '45 15 * * 1-5' || inputs.digest) && 'markets:digest' || 'markets' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "smee-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): markets"
            git pull --rebase --autostash
            git push
          fi
