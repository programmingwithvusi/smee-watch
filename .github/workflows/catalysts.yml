name: catalysts

# Every 2 hours, all week — policy news doesn't stick to trading hours or weekdays.
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

concurrency:
  group: state-catalysts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Watch catalyst news
        run: npm run watch:catalysts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
      - name: Persist state
        if: always()
        run: |
          git config user.name "smee-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): catalysts"
            git pull --rebase --autostash
            git push
          fi
